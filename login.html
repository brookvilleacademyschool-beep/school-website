<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Staff Login | Westbrook Secondary School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="portal.css"><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script><script src="portal.js" defer></script>
</head>
<body class="login-page">
  <section class="login-image"><div class="login-image-copy"><p>Westbrook Secondary School</p><h1>Staff portal</h1><p>Secure access for school staff.</p></div></section>
  <main class="login-form-wrap"><form class="login-box" id="staff-login"><a href="index.html" style="color:#18354d;font-weight:700;text-decoration:none">← Return to website</a><h2>Staff sign in</h2><p>Enter your Westbrook account details.</p><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required></div><div class="field" style="margin-top:14px"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><p class="login-error" id="login-error"></p><button class="portal-button" type="submit" style="width:100%;justify-content:center">Sign in <i data-lucide="arrow-right"></i></button></form></main>
</body>
</html>
